services:
  # 服务A: 量化核心 (FastAPI 后端)
  quant-core:
    build: 
      context: ./app
      dockerfile: Dockerfile
    image: titan-v2-backend:latest
    container_name: titan_core
    restart: always
    env_file:
      - app/.env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./app/data:/app/app/data  # 持久化数据库
      - ./docs/projects/titan-lite/reports:/app/docs/projects/titan-lite/reports # 同步生成的研报
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G

  # 服务B: 前端展示 (VitePress + Nginx)
  frontend:
    build:
      context: ./docs
      dockerfile: Dockerfile
    image: titan-v2-frontend:latest
    container_name: titan_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docs/projects/titan-lite/reports:/usr/share/nginx/html/projects/titan-lite/reports:ro # 实时查看后端生成的研报
