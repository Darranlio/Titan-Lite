services:
  # 服务A: 量化核心
  quant-core:
    # build: ./app
    image: crpi-r07w6kgm2wmfn52i.cn-beijing.personal.cr.aliyuncs.com/titan-lite-repo/titan-core:latest
    container_name: titan_core
    restart: always
    # === 关键：加载环境变量 ===
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./app/data:/app/data
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'   # 限制1核CPU
          memory: 1G    # 限制1G内存

  # 服务B: 私有文档站
  knowledge-base:
    # build: ./docs
    image: crpi-r07w6kgm2wmfn52i.cn-beijing.personal.cr.aliyuncs.com/titan-lite-repo/titan-wiki:latest
    container_name: titan_wiki
    restart: always
    ports:
      - "8080:80"
    volumes:
      # 挂载密码文件
      - ./docs/.htpasswd:/etc/nginx/.htpasswd