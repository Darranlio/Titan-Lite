services:
  # 服务A: 量化核心
  quant-core:
    build: 
      context: ./app
      dockerfile: Dockerfile
    container_name: titan_core
    restart: always
    env_file:
      - app/.env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./app/data:/app/data
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G # 调高一点，Agent 需要更多内存

  # 服务B: 私有文档站 (改用 Python 镜像内置服务，防止拉取 Nginx 失败)
  knowledge-base:
    image: titan-lite-quant-core # 复用刚才构建好的 Python 镜像
    container_name: titan_wiki
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docs/.vitepress/dist:/usr/share/nginx/html # 这里的路径可以保持挂载
    command: python3 -m http.server 80 --directory /usr/share/nginx/html