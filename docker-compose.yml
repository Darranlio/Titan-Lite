services:
  # 服务A: 量化核心
  quant-core:
    build: ./app
    image: titan-v2-local:latest
    container_name: titan_core
    restart: always
    env_file:
      - app/.env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./app/data:/app/data
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G

  # 服务B: 私有文档站 (共享同一个构建好的镜像)
  knowledge-base:
    build: ./app
    image: titan-v2-local:latest
    container_name: titan_wiki
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docs/.vitepress/dist:/usr/share/nginx/html
    command: python3 -m http.server 80 --directory /usr/share/nginx/html