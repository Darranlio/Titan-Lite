services:
  # 服务A: 量化核心
  quant-core:
    build: 
      context: ./app
      dockerfile: Dockerfile
    container_name: titan_core
    restart: always
    env_file:
      - app/.env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./app/data:/app/data
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G # 调高一点，Agent 需要更多内存

  # 服务B: 私有文档站 (Nginx 渲染静态文件)
  knowledge-base:
    image: nginx:alpine
    container_name: titan_wiki
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docs/.vitepress/dist:/usr/share/nginx/html
      - ./docs/nginx.conf:/etc/nginx/conf.d/default.conf:ro