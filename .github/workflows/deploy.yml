name: Titan-Lite CI/CD

# 触发条件：当 main 分支有代码 push 时
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动点击按钮触发

env:
  # 替换成你的 GitHub 用户名
  OWNER: darranlio 

jobs:
  # === 任务1: 构建并推送镜像到 GitHub Registry ===
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. 构建后端镜像 (Core)
      - name: Build and push Quant Core
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ env.OWNER }}/titan-core:latest

      # 2. 构建文档镜像 (Wiki)
      - name: Build and push Knowledge Base
        uses: docker/build-push-action@v5
        with:
          context: ./docs
          push: true
          tags: ghcr.io/${{ env.OWNER }}/titan-wiki:latest

  # === 任务2: 部署到阿里云服务器 ===
  deploy:
    needs: build-and-push # 必须等构建任务完成
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH Remote Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. 进入项目目录 (如果没有就克隆)
            if [ ! -d "/usr/src/Titan-Lite" ]; then
              git clone https://github.com/${{ env.OWNER }}/Titan-Lite.git /usr/src/Titan-Lite
            fi
            
            cd /usr/src/Titan-Lite
            
            # 2. 拉取最新的 docker-compose.yml 配置
            git pull origin master
            
            # 3. 登录 GHCR (为了拉取私有镜像，如果仓库公开这步可省略，但不删也无妨)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 4. 拉取最新镜像 (只拉取，不构建，省CPU)
            docker-compose pull
            
            # 5. 重启容器 (无缝切换)
            docker-compose up -d --remove-orphans
            
            # 6. 清理多余的旧镜像 (防止磁盘爆满)
            docker image prune -f